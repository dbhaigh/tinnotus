[package]
# Legacy Rust prototype manifest; intentionally excluded from the root workspace.
name = "tinnotus"
version = "0.0.0+2"
edition = "2021"
authors = ["Tinnotus Team"]
description = "Legacy Rust prototype scaffolding for Tinnotus audio processing"
license = "MIT"
keywords = ["tinnitus", "audio", "dsp", "notch-filter", "ffi"]
categories = ["multimedia::audio", "ffi"]

[lib]
name = "tinnotus"
path = "lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["c-interface"]
c-interface = []
platform-macos = []
platform-windows = []
platform-linux = []
platform-ios = []
platform-android = []

[dependencies]
# Platform-specific dependencies (conditional)
target-arch = { version = "0.0.10", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "shared_benchmark"
harness = false

[build-dependencies]