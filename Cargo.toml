[package]
name = "tinnotus"
version.workspace = true
edition.workspace = true
authors = ["Tinnotus Team"]
description = "Experimental frequency-specific audio processing"
license.workspace = true
repository = "https://github.com/dbhaigh/tinnotus"
readme = "README.md"
keywords = ["audio", "dsp", "notch-filter"]
categories = ["multimedia::audio"]

[workspace]
members = ["backend"]
# `shared` contains active C++ sources and excluded legacy Rust scaffolding.
exclude = ["shared"]
resolver = "2"

[workspace.package]
version = "0.0.0+2"
edition = "2021"
license = "MIT"

[dependencies]
eframe = "0.27"
egui = "0.27"
hound = "3.5"
tinnotus-audio-backend = { path = "backend" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 1

[lints.rust]
unsafe_code = "deny"
